[pytest]
minversion = 8.0
testpaths = tests
python_files = _smoke_*.py test_*.py
python_functions = test_*
pythonpath = .
addopts = -ra --strict-markers --strict-config
markers =
    smoke: 端到端冒烟（验证完整链路）
    integration: 集成测试（子进程 / 服务编排）
    needs_sandbox: 需 OpenSandbox 在线（默认不可达时 skip，--require-sandbox 时严格 fail）
    needs_kafka: 需真实 Kafka（默认不可达时 skip，--require-kafka 时严格 fail）
    needs_db: 需真实 PostgreSQL/MySQL（compose 提供，默认不可达时 skip，--require-db 时严格 fail）
    slow: 较慢的测试
filterwarnings =
    ignore::DeprecationWarning
